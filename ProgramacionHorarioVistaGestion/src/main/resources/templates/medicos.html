<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Consultar médicos</title>
</head>
<body>
    <h1>Lista de médicos</h1>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Especialidad</th>
        </tr>

        <tr th:each="m : ${lista}">
            <td th:text="${m.idMed}"></td>
            <td th:text="${m.nom}"></td>
            <td th:text="${m.especialidad}"></td>
        </tr>
    </table>

    <br>
    <a th:href="@{/inicio}">Volver al menú</a>
</body>
</html>
